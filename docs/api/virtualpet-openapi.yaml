        status: { $ref: '#/components/schemas/ShipmentStatus' }
        shippingAddress: { $ref: '#/components/schemas/Address' }
        statusHistory:
          type: array
          items:
            type: object
            properties:
              status: { $ref: '#/components/schemas/ShipmentStatus' }
              at: { type: string, format: date-time }

