      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: La pasarela de pago no respondiÃ³
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Money:
      type: string
      description: Importe decimal con escala fija, serializado como string (BigDecimal).
      examples: ['1500.00']
    Currency:
      type: string
      description: CÃ³digo de moneda ISO 4217.
      examples: [ARS]

    Problem:
      type: object
      description: Error segÃºn RFC 7807.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
